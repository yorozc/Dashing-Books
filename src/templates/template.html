<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    {% block header %}
        <title>Dashing-Books</title>
    {% endblock %}
</head>
<body>
    <h1>Dashing Books</h1>
    
    {%for book in books %}
        <div class="book" style="border: 1px solid red;">
            <h1>Book {{ loop.index0 + 1 }}</h1>
            <h2> 
                <a href="{{ url_for("book", book_id=book.id) }}">
                    {{ book.title }}
                </a>
            </h2>
            <p> {{ book.author }} </p>
            <button id="addBookBtn">Add Book</button>
            <button id="delBookBtn">Delete Book</button>
            <button id="editBookBtn">Edit Book</button>
            
        </div>
    {% endfor %}
    {% block body %}
    {% endblock %}
</body>
</html>
